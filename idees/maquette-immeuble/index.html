<title>Immeuble Berthier</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : un seul étage à l'écran. L'immeuble défile verticalement comme vu depuis un
   ascenseur ; le panneau de boutons d'étage sert de navigation. Couleurs et polices du site
   Berthier (sombre uniquement, par choix de marque). */
:root{
  color-scheme:dark;
  --bg:#08090a; --surface:#111214; --surface2:#17181b; --surface3:#1e1f23;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --text:#f7f8f8; --text2:#a1a5ae; --text3:#6b7079;
  --accent:#4f8cff; --accent-hover:#6a9dff;
  --green:#3ecf8e; --nuit:#0c0d10; --lampe:#ffd98a;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --trajet:.85s;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:1rem/1.55 var(--sans);overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
.barre{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--line2);background:var(--surface)}
.enseigne{font:500 .8rem var(--mono);letter-spacing:.22em;text-transform:uppercase}
.maquette{font:500 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.maquette b{color:var(--lampe);font-weight:500}

/* ── La cage : un étage visible, les autres au-dessus et en dessous ── */
.cage{overflow:hidden;position:relative;min-height:0}
.piste{height:100%;transition:transform var(--trajet) cubic-bezier(.65,0,.25,1);will-change:transform}
.niveau{height:100%;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);border-bottom:14px solid var(--surface3);background:var(--surface)}
.scene{position:relative;background:var(--nuit);border-right:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;min-height:0}
.scene .no{position:absolute;top:2%;left:6%;font:500 clamp(4rem,22vh,11rem)/1 var(--mono);letter-spacing:-.06em;color:var(--line2);user-select:none}
.scene .lueur{position:absolute;inset:0;opacity:0;transition:opacity .9s .35s}
.ouvert .lueur{background:radial-gradient(90% 70% at 50% 100%,rgba(79,140,255,.28),transparent 70%)}
.ferme .lueur{background:radial-gradient(90% 70% at 50% 100%,rgba(255,217,138,.16),transparent 70%)}
.niveau.ici.ouvert .lueur,.niveau.ici.note .lueur{opacity:1}
.perso{position:relative;height:min(58%,380px);aspect-ratio:24/32;margin-bottom:22px;image-rendering:pixelated;transition:filter .6s .3s}
.perso svg,.perso img{width:100%;height:100%;display:block}
.ferme .perso{filter:brightness(.55) saturate(.45)}
.ferme.note .perso{filter:none}
.niveau.ici .perso{animation:arrivee .5s var(--trajet) both}
@keyframes arrivee{0%{transform:translateY(0)}40%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.scene .sol{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--surface3);border-top:2px solid var(--line2)}
.fiche{display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0;
  padding:24px clamp(18px,5vw,56px);opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.niveau.ici .fiche{opacity:1;transform:none;transition-delay:calc(var(--trajet) - .25s)}
.etat{font:500 .8rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text3);display:flex;align-items:center;gap:8px}
.etat::before{content:"";width:8px;height:8px;background:var(--text3)}
.ouvert .etat{color:var(--green)}.ouvert .etat::before{background:var(--green)}
.note .etat{color:var(--lampe)}.note .etat::before{background:var(--lampe)}
.accroche{margin:0 0 6px;color:var(--text);font-size:1rem;font-weight:500;max-width:30em;border-left:3px solid var(--accent);padding-left:12px}
.nom{font-size:clamp(2.2rem,6vw,4rem);line-height:1;letter-spacing:-.035em;font-weight:700;margin:0}
.role{font-size:1.15rem;color:var(--text2);margin:0}
.fiche p.texte{margin:0;color:var(--text2);font-size:1.05rem;max-width:30em}
.liste{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0;margin:0;list-style:none;font:400 .8rem var(--mono);color:var(--text3)}
.liste li::before{content:"· "}
.btn{align-self:flex-start;font:600 .95rem var(--sans);border-radius:6px;padding:12px 18px;border:1px solid var(--line2);background:transparent;color:var(--text);cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.plein{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.plein:hover{background:var(--accent-hover)}
.btn[aria-pressed="true"]{border-color:var(--lampe);color:var(--lampe)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.indice{position:absolute;left:50%;top:14px;transform:translateX(-50%);margin:0;z-index:5;background:var(--accent);color:#fff;font-weight:600;font-size:.95rem;
  padding:10px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.piste.bute-bas{animation:buteBas .45s ease-out}.piste.bute-haut{animation:buteHaut .45s ease-out}
@keyframes buteBas{40%{translate:0 -18px}}@keyframes buteHaut{40%{translate:0 18px}}

/* ── Le menu ── */
.menu-btn{font:500 .8rem var(--sans);color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:6px;padding:8px 14px;min-height:44px;cursor:pointer}
.menu-btn:hover{background:var(--surface3)}
.barre .maquette{margin-left:auto}
@media (max-width:520px){.barre .maquette span{display:none}}
.menu{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end}
.menu[hidden]{display:none}
.menu-fond{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.menu-feuille{position:relative;width:min(380px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line2);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 18px;overflow:auto;animation:tiroir .25s ease-out}
@keyframes tiroir{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.menu-tete{display:flex;justify-content:space-between;align-items:center;font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text3);padding-bottom:12px;border-bottom:1px solid var(--line)}
.menu ul{list-style:none;margin:0;padding:0}
.menu li button{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  color:var(--text);padding:14px 2px;cursor:pointer;font:inherit}
.menu li button:hover{background:var(--surface2)}
.menu li .et{font:500 .8rem var(--mono);color:var(--text3)}
.menu li b{display:block;font-size:1.05rem;font-weight:600}
.menu li small{color:var(--text2);font-size:.86rem}
.menu li .st{font:500 .64rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap}
.menu li .st.o{color:var(--green)}.menu li .st.n{color:var(--lampe)}
.menu li button[aria-current="true"] .et{color:var(--accent)}
.menu-note{margin:16px 0 0;color:var(--text3);font-size:.84rem}

/* ── Le panneau d'ascenseur ── */
.panneau{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border-left:1px solid var(--line2);
  padding:14px 12px;padding-right:max(12px,env(safe-area-inset-right,0px))}
.panneau button{width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--text2);
  font:500 .8rem var(--mono);cursor:pointer;position:relative;transition:background .2s,color .2s,border-color .2s}
.panneau button:hover{color:var(--text);border-color:var(--text3)}
.panneau button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.panneau button.vote::after{content:"";position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--lampe);border:2px solid var(--surface2)}
.panneau .fleche{border-radius:8px;height:44px;font-size:1rem}
.panneau .fleche:disabled{opacity:.25;cursor:default}
.panneau .fleche.appel{animation:appel 1.6s ease-in-out infinite;color:var(--text);border-color:var(--accent)}
@keyframes appel{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.vote-ligne{font:400 .74rem var(--mono);color:var(--lampe);min-height:1.3em;margin:0}

@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .niveau{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,36%) minmax(0,1fr)}
  .scene{border-right:0;border-bottom:1px solid var(--line)}
  .perso{height:78%;margin-bottom:16px}
  .scene .sol{height:16px}
  .fiche{justify-content:flex-start;gap:10px;padding:18px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));overflow:auto}
  .nom{font-size:2rem}.role{font-size:1rem}.fiche p.texte{font-size:.98rem}.accroche{font-size:.92rem}
  .panneau{flex-direction:row;border-left:0;border-top:1px solid var(--line2);gap:6px;
    padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
  .panneau button,.panneau .fleche{width:44px;height:44px;flex:none}
  .fiche .btn{position:sticky;bottom:0;z-index:2;background:var(--surface);box-shadow:0 0 0 10px var(--surface)}
  .fiche .btn.plein{background:var(--accent)}
  .panneau .haut{order:9}
}
@media (prefers-reduced-motion:reduce){:root{--trajet:0s}*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="barre"><span class="enseigne">Berthier &amp; Cie</span><span class="maquette"><b>Maquette</b><span> · noms provisoires</span></span><button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="menu">Menu</button></header>
  <main class="cage" id="cage" aria-live="polite"><div class="piste" id="piste"></div><p class="indice" id="indice" hidden></p></main>
  <nav class="panneau" id="panneau" aria-label="Ascenseur"></nav>
  <div class="menu" id="menu" hidden>
    <div class="menu-fond" data-fermer></div>
    <div class="menu-feuille" role="dialog" aria-label="Tous les étages">
      <div class="menu-tete"><span>Tous les étages</span><button class="menu-btn" data-fermer>Fermer</button></div>
      <ul id="menu-liste"></ul>
      <p class="menu-note">Maquette : seule l'appli Berthier existe. Les autres étages servent à mesurer ce qui intéresse.</p>
    </div>
  </div>
</div>

  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]==='.'&&[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>plein[y+dy]?.[x+dx]))g[y][x]='K';
  const c={K:'#16171a',S:o.peau[0],s:o.peau[1],E:'#16171a',m:'#b88378',H:o.poil[0],h:o.poil[1],G:'#16171a',g:'#e6eefc',
    T:o.tissu[0],t:o.tissu[1],A:o.touche[0],a:o.touche[1],W:'#f2f3f5',C:'#565b66',c:'#363941',D:'#c9ced8',F:'#e3c58f',f:'#b89455',P:'#2a2c32',B:'#16171a'};
  let r='';
  for(let y=0;y<H;y++){let x=0;while(x<W){const k=g[y][x];if(k==='.'){x++;continue}let n=1;while(x+n<W&&g[y][x+n]===k)n++;r+=`<rect x="${x}" y="${y}" width="${n}" height="1" fill="${c[k]}"/>`;x+=n}}
  return `<svg viewBox="0 0 24 32" shape-rendering="crispEdges" role="img" aria-label="${o.alt}">${r}</svg>`;
}


const ETAGES=[
  {no:'4e',id:'agenda',nom:'Vasseur',role:"l'organisatrice",texte:"Elle tient ton calendrier de marchés et te rappelle les inscriptions avant qu'il soit trop tard.",
   points:['Calendrier','Rappels','Inscriptions'],
   look:{alt:'Vasseur',cheveux:'long',peau:['#c98f6b','#a8714f'],poil:['#2b1e15','#4a3526'],tissu:['#7a4b8f','#5d3870'],touche:['#e0527a','#b53a5e'],haut:'pull',objet:'agenda'}},
  {no:'3e',id:'commerce',nom:'Marchand',role:'le commercial',texte:"Il suit tes clients et tes commandes, et il prépare tes factures.",
   points:['Clients','Commandes','Factures'],
   look:{alt:'Marchand',cheveux:'court',peau:['#f1c7a3','#d9a37f'],poil:['#8a5a2b','#b07a43'],tissu:['#2f6f5e','#235347'],touche:['#ffc531','#c9961a'],haut:'veste',cravate:true,objet:'tablette'}},
  {no:'2e',id:'legal',nom:'Delmas',role:'la juriste',texte:"Elle t'explique les démarches et te fournit des modèles : mentions légales, conditions de vente, statut.",
   points:['Modèles','Démarches','Liens officiels'],
   look:{alt:'Delmas',cheveux:'chignon',lunettes:true,peau:['#e9b998','#c99473'],poil:['#5b2c1e','#7d4230'],tissu:['#2a3350','#1d2439'],touche:['#4f8cff','#2f63c9'],haut:'veste',objet:'dossier'}},
  {no:'1er',id:'site',nom:'Kovac',role:"l'informaticien",texte:"Il monte ton site en glissant des blocs, et il y branche le paiement en ligne.",
   points:['Créateur de site','Paiement','Export'],
   look:{alt:'Kovac',cheveux:'bonnet',barbe:true,peau:['#f1c7a3','#d9a37f'],poil:['#3a2a20','#5a4232'],tissu:['#3b3f4a','#2a2c32'],touche:['#3ecf8e','#2a9d69'],haut:'capuche',objet:'portable'}},
  {no:'RDC',id:'berthier',nom:'Berthier',role:'le comptable',ouvert:true,texte:"Il note tes ventes en deux tapotements, suit ton stock et te dit quels marchés valent le déplacement.",
   points:['Ventes','Stock','Marchés','Dépenses','Bilan']},
];


let notes=[];
try{notes=JSON.parse(localStorage.getItem('immeuble-notes')||'[]')}catch(e){}
let ici=ETAGES.length-1;          // on démarre au rez-de-chaussée
let enRoute=false, aBouge=false;
const piste=document.getElementById('piste'), panneau=document.getElementById('panneau');

function niveauHTML(e,i){
  const note=notes.includes(e.id);
  const figure=e.ouvert?`<img src="${BERTHIER}" alt="Berthier">`:perso(e.look);
  const etat=e.ouvert?'Ouvert':note?'Tu seras prévenu':'Bientôt';
  const action=e.ouvert
    ?`<a class="btn plein" href="https://ariane-app.onrender.com" target="_blank" rel="noopener">Ouvrir Berthier</a>`
    :`<button class="btn" id="btn-${e.id}" data-id="${e.id}" aria-pressed="${note}">${note?'C\u2019est noté':'Préviens-moi'}</button>`;
  return `<section class="niveau ${e.ouvert?'ouvert':'ferme'} ${note?'note':''} ${i===ici?'ici':''}" data-i="${i}" aria-hidden="${i!==ici}">
    <div class="scene"><span class="no" aria-hidden="true">${e.no==='RDC'?'0':e.no[0]}</span><div class="lueur"></div><div class="perso">${figure}</div><div class="sol"></div></div>
    <div class="fiche">
      ${e.ouvert?'<p class="accroche">Une équipe entière, une appli par personne. Les collègues de Berthier sont aux étages.</p>':''}
      <span class="etat">${e.no==='RDC'?'Rez-de-chaussée':e.no+' étage'} · ${etat}</span>
      <h1 class="nom">${e.nom}</h1>
      <p class="role">${e.role[0].toUpperCase()+e.role.slice(1)}</p>
      <p class="texte">${e.texte}</p>
      ${action}
      <ul class="liste">${e.points.map(p=>`<li>${p}</li>`).join('')}</ul>
      ${i===ETAGES.length-1?'':'<p class="vote-ligne"></p>'}
    </div></section>`;
}
function rendrePanneau(){
  panneau.innerHTML=`<button class="fleche haut ${aBouge?'':'appel'}" data-pas="-1" aria-label="Monter d'un étage" ${ici===0?'disabled':''}>▲</button>`
    +ETAGES.map((e,i)=>`<button data-aller="${i}" class="${notes.includes(e.id)?'vote':''}" aria-current="${i===ici}" aria-label="${e.nom}, ${e.no}">${e.no==='RDC'?'RDC':e.no[0]}</button>`).join('')
    +`<button class="fleche bas" data-pas="1" aria-label="Descendre d'un étage" ${ici===ETAGES.length-1?'disabled':''}>▼</button>`;
}
function placer(){
  piste.style.transform=`translateY(${-ici*100}%)`;
  piste.querySelectorAll('.niveau').forEach((n,i)=>{n.classList.toggle('ici',i===ici);n.setAttribute('aria-hidden',i!==ici);
    n.querySelectorAll('a,button').forEach(b=>b.tabIndex=i===ici?0:-1)});
  rendrePanneau();
}
const indice=document.getElementById('indice');let minuterie;
function buter(sens){            // on est au bout : petit rebond et rappel de la direction
  piste.classList.remove('bute-bas','bute-haut');void piste.offsetWidth;piste.classList.add(sens>0?'bute-bas':'bute-haut');
  indice.textContent=sens>0?'Les étages sont au-dessus : glisse vers le bas ou touche ▲':'C\u2019est le dernier étage';
  indice.hidden=false;clearTimeout(minuterie);minuterie=setTimeout(()=>{indice.hidden=true},2600);
}
function aller(i){
  if(enRoute)return;
  if(i<0||i>ETAGES.length-1)return buter(i<0?-1:1);
  if(i===ici)return;indice.hidden=true;
  // Trajet plus long quand on saute plusieurs étages, comme un vrai ascenseur.
  const duree=.55+.3*Math.abs(i-ici);
  document.documentElement.style.setProperty('--trajet',duree+'s');
  ici=i;aBouge=true;enRoute=true;placer();
  setTimeout(()=>{enRoute=false},matchMedia('(prefers-reduced-motion:reduce)').matches?0:duree*1000);
}
function tout(){piste.innerHTML=ETAGES.map(niveauHTML).join('');placer()}

const menu=document.getElementById('menu'), menuBtn=document.getElementById('menu-btn');
function rendreMenu(){
  document.getElementById('menu-liste').innerHTML=ETAGES.map((e,i)=>{
    const note=notes.includes(e.id);
    return `<li><button data-aller="${i}" aria-current="${i===ici}"><span class="et">${e.no}</span>
      <span><b>${e.nom}</b><small>${e.role[0].toUpperCase()+e.role.slice(1)} · ${e.points.slice(0,3).join(', ')}</small></span>
      <span class="st ${e.ouvert?'o':note?'n':''}">${e.ouvert?'Ouvert':note?'Noté':'Bientôt'}</span></button></li>`}).join('');
}
function ouvrirMenu(oui){
  if(oui)rendreMenu();
  menu.hidden=!oui;menuBtn.setAttribute('aria-expanded',oui);
  if(oui)menu.querySelector('[aria-current="true"]')?.focus();else menuBtn.focus();
}
menuBtn.addEventListener('click',()=>ouvrirMenu(true));
menu.addEventListener('click',ev=>{
  if(ev.target.closest('[data-fermer]'))return ouvrirMenu(false);
  const b=ev.target.closest('button[data-aller]');if(b){ouvrirMenu(false);aller(+b.dataset.aller)}
});

panneau.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.pas)aller(ici+ +b.dataset.pas);else aller(+b.dataset.aller)});
piste.addEventListener('click',ev=>{const b=ev.target.closest('button[data-id]');if(!b)return;
  const id=b.dataset.id;notes=notes.includes(id)?notes.filter(n=>n!==id):[...notes,id];
  try{localStorage.setItem('immeuble-notes',JSON.stringify(notes))}catch(e){}
  const n=b.closest('.niveau'),note=notes.includes(id);
  n.classList.toggle('note',note);b.setAttribute('aria-pressed',note);b.textContent=note?'C\u2019est noté':'Préviens-moi';
  n.querySelector('.etat').textContent=`${ETAGES[ici].no} étage · ${note?'Tu seras prévenu':'Bientôt'}`;
  n.querySelector('.vote-ligne').textContent=note?'Dans la vraie version, ce clic serait compté.':'';
  rendrePanneau()});
// L'immeuble suit le doigt et la molette, comme une page : tirer vers le bas fait monter.
let cumul=0;
addEventListener('wheel',ev=>{if(enRoute||!menu.hidden)return;cumul+=ev.deltaY;if(Math.abs(cumul)>60){aller(ici+(cumul>0?1:-1));cumul=0}},{passive:true});
let y0=null;
let ficheDepart=null,defilDepart=0;
addEventListener('touchstart',ev=>{y0=ev.touches[0].clientY;ficheDepart=ev.target.closest?.('.fiche')||null;defilDepart=ficheDepart?ficheDepart.scrollTop:0},{passive:true});
addEventListener('touchend',ev=>{if(y0===null||!menu.hidden){y0=null;return}const d=ev.changedTouches[0].clientY-y0;y0=null;
  if(ficheDepart){const f=ficheDepart,reste=f.scrollHeight-f.clientHeight;if(f.scrollTop!==defilDepart||(d<0&&f.scrollTop<reste-1)||(d>0&&f.scrollTop>1))return}
  if(Math.abs(d)>50)aller(ici+(d<0?1:-1))},{passive:true});
addEventListener('keydown',ev=>{if(!menu.hidden){if(ev.key==='Escape')ouvrirMenu(false);return}
  if(ev.key==='ArrowUp'||ev.key==='PageUp'){ev.preventDefault();aller(ici-1)}
  if(ev.key==='ArrowDown'||ev.key==='PageDown'){ev.preventDefault();aller(ici+1)}});
piste.style.transition='none';tout();requestAnimationFrame(()=>requestAnimationFrame(()=>{piste.style.transition=''}));
</script>
